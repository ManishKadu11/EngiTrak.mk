<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EngiTrack - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:#eef4ff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:1050px;
    min-height:650px;
    background:white;
    border-radius:24px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 60px rgba(20,50,100,.15);
}

/* LEFT */

.left-panel{
    width:50%;
    background:linear-gradient(145deg,#0b1f3a,#123e70);
    color:white;
    padding:55px 45px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:32px;
    font-weight:800;
    margin-bottom:55px;
}

.logo span{
    color:#4da3ff;
}

.gear{
    font-size:70px;
    margin-bottom:25px;
}

.left-panel h1{
    font-size:42px;
    line-height:1.15;
    margin-bottom:20px;
}

.left-panel p{
    font-size:17px;
    line-height:1.7;
    color:#d6e5f8;
    max-width:420px;
}

.features{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:35px;
}

.feature{
    padding:9px 15px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:20px;
    font-size:13px;
}


/* RIGHT */

.right-panel{
    width:50%;
    padding:55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right-panel h2{
    font-size:32px;
    color:#102d50;
    margin-bottom:10px;
}

.subtitle{
    color:#718096;
    margin-bottom:35px;
    line-height:1.5;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#263b55;
}

.form-group input{
    width:100%;
    padding:15px 16px;
    border:1px solid #d7e0eb;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.form-group input:focus{
    border-color:#2878d7;
    box-shadow:0 0 0 3px rgba(40,120,215,.1);
}


/* SIGNUP FIELD */

#confirmGroup{
    display:none;
}

.signup-mode #confirmGroup{
    display:block;
}


/* OPTIONS */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:5px 0 25px;
    font-size:13px;
}

.remember{
    display:flex;
    align-items:center;
    gap:7px;
    color:#64748b;
}

.remember input{
    width:auto;
}

.forgot{
    color:#2878d7;
    text-decoration:none;
    cursor:pointer;
}


/* BUTTON */

.auth-button{
    width:100%;
    border:none;
    padding:16px;
    border-radius:10px;
    background:#1769c2;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.auth-button:hover{
    background:#0e56a3;
}

.auth-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}


/* MESSAGE */

.message{
    min-height:22px;
    margin:15px 0;
    font-size:14px;
    text-align:center;
    line-height:1.5;
}

.message.error{
    color:#d93025;
}

.message.success{
    color:#16803c;
}


/* SWITCH */

.switch-account{
    text-align:center;
    margin-top:25px;
    color:#718096;
    font-size:14px;
}

#switchButton{
    border:none;
    background:none;
    color:#1769c2;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
}


/* HOME */

.back-home{
    text-align:center;
    margin-top:25px;
}

.back-home a{
    color:#718096;
    text-decoration:none;
    font-size:13px;
}


/* MOBILE */

@media(max-width:800px){

    .container{
        flex-direction:column;
        max-width:500px;
    }

    .left-panel{
        width:100%;
        padding:35px 30px;
    }

    .right-panel{
        width:100%;
        padding:40px 30px;
    }

    .logo{
        margin-bottom:30px;
    }

    .gear{
        font-size:55px;
    }

    .left-panel h1{
        font-size:32px;
    }
}

</style>

</head>

<body>

<div class="container" id="container">

    <div class="left-panel">

        <div class="logo">
            Engi<span>Track</span>
        </div>

        <div class="gear">
            ⚙️
        </div>

        <h1>
            Build Your<br>
            Engineering Journey
        </h1>

        <p>
            Learn the right skills, track your progress
            and build a better engineering career with
            EngiTrack.
        </p>

        <div class="features">
            <div class="feature">Learn</div>
            <div class="feature">Track</div>
            <div class="feature">Build</div>
            <div class="feature">Grow</div>
        </div>

    </div>


    <div class="right-panel">

        <h2 id="formTitle">
            Welcome Back
        </h2>

        <p class="subtitle" id="formSubtitle">
            Login to continue your engineering journey.
        </p>

        <form id="authForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div
                class="form-group"
                id="confirmGroup"
            >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

            </div>


            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="auth-button"
                id="authButton"
            >
                Login
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </form>


        <div class="switch-account">

            <span id="switchText">
                Don't have an account?
            </span>

            <button
                type="button"
                id="switchButton"
            >
                Create Account
            </button>

        </div>


        <div class="back-home">

            <a href="index.html">
                ← Back to EngiTrack
            </a>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
    "https://sdfvrukdzoaufgmelylz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Yp4BEdGOUdSoJ1xz0rlwsQ_xsJpYoQp";


/* =========================
   CREATE CLIENT
========================= */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   ELEMENTS
========================= */

const form =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const authButton =
    document.getElementById("authButton");

const message =
    document.getElementById("message");

const container =
    document.getElementById("container");

const switchButton =
    document.getElementById("switchButton");

const switchText =
    document.getElementById("switchText");

const forgotPassword =
    document.getElementById("forgotPassword");

const formTitle =
    document.getElementById("formTitle");

const formSubtitle =
    document.getElementById("formSubtitle");


let signupMode = false;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

    message.textContent = text;

    message.className =
        "message " + type;
}


function clearMessage(){

    message.textContent = "";

    message.className = "message";
}


/* =========================
   SWITCH LOGIN / SIGNUP
========================= */

switchButton.addEventListener(
    "click",
    function(){

        signupMode = !signupMode;

        clearMessage();

        container.classList.toggle(
            "signup-mode",
            signupMode
        );


        if(signupMode){

            formTitle.textContent =
                "Create Account";

            formSubtitle.textContent =
                "Create your EngiTrack account.";

            authButton.textContent =
                "Create Account";

            switchText.textContent =
                "Already have an account?";

            switchButton.textContent =
                "Login";

            forgotPassword.style.display =
                "none";

            confirmPasswordInput.required =
                true;

        }
        else{

            formTitle.textContent =
                "Welcome Back";

            formSubtitle.textContent =
                "Login to continue your engineering journey.";

            authButton.textContent =
                "Login";

            switchText.textContent =
                "Don't have an account?";

            switchButton.textContent =
                "Create Account";

            forgotPassword.style.display =
                "inline";

            confirmPasswordInput.required =
                false;

        }

    }
);


/* =========================
   LOGIN / SIGNUP
========================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter email and password.",
                "error"
            );

            return;
        }


        /* SIGNUP */

        if(signupMode){

            if(password.length < 6){

                showMessage(
                    "Password must be at least 6 characters.",
                    "error"
                );

                return;
            }


            if(password !== confirmPassword){

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            authButton.disabled = true;

            authButton.textContent =
                "Creating Account...";


            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });


            if(error){

                showMessage(
                    error.message,
                    "error"
                );

                authButton.disabled = false;

                authButton.textContent =
                    "Create Account";

                return;
            }


            if(data.session){

                window.location.href =
                    "index.html";

            }
            else{

                showMessage(
                    "Account created! Please check your email for confirmation.",
                    "success"
                );

                authButton.disabled = false;

                authButton.textContent =
                    "Create Account";
            }

            return;
        }


        /* LOGIN */

        authButton.disabled = true;

        authButton.textContent =
            "Logging in...";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if(error){

            showMessage(
                error.message,
                "error"
            );

            authButton.disabled = false;

            authButton.textContent =
                "Login";

            return;
        }


        if(data.session){

            showMessage(
                "Login successful! Redirecting...",
                "success"
            );

            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                800
            );

        }

    }
);
/* =========================
   FORGOT PASSWORD
========================= */

forgotPassword.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            emailInput.value.trim();


        if(!email){

            showMessage(
                "Please enter your email first.",
                "error"
            );

            emailInput.focus();

            return;
        }


        forgotPassword.textContent =
            "Sending...";


        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/login.html"
                }
            );


        if(error){

            showMessage(
                error.message,
                "error"
            );

        }
        else{

            showMessage(
                "Password reset link has been sent to your email.",
                "success"
            );

        }


        forgotPassword.textContent =
            "Forgot Password?";

    }
);


/* =========================
   CHECK SESSION
========================= */

async function checkUser(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(data.session){

        console.log(
            "User already logged in."
        );

    }

}


checkUser();

</script>

</body>
</html>
